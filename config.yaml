# Configuration SmEcoFarm - un seul Raspberry Pi 4 pour le champ, l'entrepôt et l'accès.
# Les secrets (token Blynk, mot de passe Gmail) vont dans le fichier .env.

champ:
  actif: true
  # Webcam USB du champ : index (0, 1, 2...) ou chemin stable /dev/v4l/by-id/...
  # (avec 2 webcams, chaque webcam crée souvent 2 index : essayer 0 et 2)
  camera: 0
  intervalle_oiseaux_s: 1.0        # une analyse « oiseaux » par seconde
  seuil_oiseaux: 0.5               # confiance minimale (0 à 1)
  pause_buzzer_s: 30               # délai minimum entre deux déclenchements du buzzer
  intervalle_maladies_s: 1800      # une analyse « maladies » toutes les 30 min
  plante: tomato                   # classes PlantVillage à garder
  seuil_maladies: 0.6              # en dessous : résultat « incertain »

entrepot:
  actif: true
  camera: 2                        # webcam USB de l'entrepôt (détection de flamme)
  intervalle_capteurs_s: 3.0       # le DHT11 ne supporte pas plus d'une mesure / 2 s
  intervalle_camera_s: 1.0

  conservation:                    # seuils pour des tomates mûres
    temp_ventilateur_marche: 24    # °C : le ventilateur démarre au-dessus
    temp_ventilateur_arret: 22     # °C : il s'arrête en dessous (hystérésis)
    temp_alerte_haute: 30          # °C : alerte « dégradation rapide »
    temp_alerte_basse: 7           # °C : alerte « dommage par le froid »
    humidite_alerte_basse: 60      # % : alerte « air trop sec »
    humidite_ventilateur_marche: null  # désactivé (DHT11 limité à 80 %) ; avec un DHT22 : 95
    humidite_ventilateur_arret: 90
    ventiler_si_air_vicie: true    # ventiler quand le MQ-135 signale un air anormal

  incendie:
    hausse_temp_c: 5               # montée de 5 °C...
    fenetre_hausse_s: 60           # ... en 60 secondes = indice incendie
    temp_max_c: 45                 # ou température supérieure à 45 °C

  camera_feu:
    methode: hsv                   # hsv = plages de couleurs du code d'origine ; rgb = autre règle
    proportion_min: 0.02           # 2 % de l'image de couleur flamme (seuil du code d'origine)
    images_consecutives: 3         # images de suite pour confirmer
    exiger_scintillement: true     # une flamme bouge ; des tomates rouges immobiles non
    scintillement_min: 0.003       # part de l'image qui doit changer d'une image à l'autre

acces:                             # contrôle d'accès de l'entrepôt (badge RFID + porte)
  actif: true
  cartes_autorisees:               # numéro de carte : nom (scripts/lire_badge.py affiche le numéro)
    1046817149299: Carte principale
  duree_ouverture_s: 4             # durée d'ouverture de la porte
  angle_ferme: 0
  angle_ouvert: 90
  anti_rebond_s: 3                 # une même carte n'est traitée qu'une fois pendant ce délai
  duree_alarme_refus_s: 2          # buzzer quand une carte est refusée
  ouvrir_si_incendie: true         # porte ouverte pour l'évacuation pendant l'alerte incendie

led:
  seuil_temperature: 30            # LED allumée au-dessus (ou quand la porte est ouverte)

materiel:                          # numéros GPIO (BCM) du câblage actuel, voir docs/CABLAGE.md
  dht11_gpio: 17                   # broche physique 11
  mq135_do_gpio: 16                # broche physique 36 (via pont diviseur !)
  mq135_actif_bas: true            # DO = 0 quand du gaz est détecté (LED DO allumée)
  mq135_prechauffage_s: 180
  relais_ventilateur_gpio: 27      # broche physique 13
  relais_actif_bas: true           # la plupart des modules relais
  buzzer_gpio: 23                  # broche physique 16
  led_gpio: 22                     # broche physique 15
  servo_porte_gpio: 26             # broche physique 37
  # Lecteur RFID RC522 : bus SPI (GPIO 8, 9, 10, 11), voir docs/CABLAGE.md

blynk:
  actif: true                      # nécessite BLYNK_TOKEN dans .env
  serveur: blynk.cloud             # ou le serveur de votre région (ex. fra1.blynk.cloud)
  intervalle_s: 5
  pins:                            # pins virtuelles des datastreams (null = non utilisée)
    # --- pins du dashboard d'origine (inchangées) ---
    led: V0                        # 0/1
    temperature: V3                # °C
    humidite: V4                   # %
    air_anormal: V5                # 0/1 (MQ-135)
    derniere_carte: V6             # texte : numéro de la dernière carte
    message: V7                    # texte d'état
    # --- nouvelles pins ---
    porte_ouverte: V1              # 0/1
    ouvrir_porte: V2               # bouton (commande) : ouvrir la porte à distance
    oiseau_present: V8             # 0/1
    oiseaux_compteur: V9           # entier
    maladie: V10                   # texte
    maladie_confiance: V11         # %
    buzzer_oiseaux_actif: V12      # interrupteur (commande) : 1 = buzzer autorisé
    ventilateur: V13               # 0/1
    mode_ventilateur: V14          # commande : 0 = auto, 1 = marche forcée, 2 = arrêt forcé
    niveau_incendie: V15           # 0 normal, 1 vigilance, 2 alerte
    rearmement: V16                # bouton (commande) : réarmer l'alerte incendie

email:
  actif: true                      # nécessite GMAIL_USER, GMAIL_APP_PASSWORD, EMAIL_TO dans .env
  pause_min: 10                    # délai minimum entre deux e-mails

journal:
  dossier: data                    # CSV, photos et fichier de log
  intervalle_s: 60                 # une ligne CSV par minute
